<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evk Parser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Evk Parser</h1>
            <span class="version">v1.0</span>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="parse">解析</button>
            <button class="tab-btn" data-tab="view">查看</button>
            <a href="help.html" class="tab-btn" style="text-decoration:none">帮助</a>
        </div>
    </header>

    <main>
        <section id="parse-tab" class="tab-content active">
            <div class="card">
                <h2>解析 APK</h2>
                <p class="card-desc">提取精灵、动画和音频资源</p>

                <div class="input-group">
                    <label>源文件夹</label>
                    <div class="input-row">
                        <input type="text" id="source-folder" placeholder="APK 解压后的目录...">
                        <button class="btn-secondary" onclick="browseFolder('source')">浏览</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>输出文件夹</label>
                    <div class="input-row">
                        <input type="text" id="output-folder" placeholder="留空则默认输出">
                        <button class="btn-secondary" onclick="browseFolder('output')">浏览</button>
                    </div>
                </div>

                <div class="actions">
                    <button id="parse-btn" onclick="startParsing()">开始解析</button>
                </div>

                <div id="progress-container" class="hidden">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div id="progress-text">准备中...</div>
                </div>

                <div id="result-summary" class="hidden"></div>
            </div>
        </section>

        <section id="view-tab" class="tab-content">
            <div class="card">
                <h2>查看项目</h2>

                <div class="input-group">
                    <div class="input-row">
                        <select id="project-select" onchange="loadSelectedProject()">
                            <option value="">-- 选择项目 --</option>
                        </select>
                        <button class="btn-secondary" onclick="loadProjects()">刷新</button>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-row">
                        <input type="text" id="manual-path" placeholder="或输入项目路径...">
                        <button onclick="loadProjectByPath()">加载</button>
                    </div>
                </div>
            </div>

            <div id="viewer-container" class="hidden">
                <div class="viewer-layout">
                    <div class="sidebar left-sidebar">
                        <div class="sidebar-header">
                            <h3>对象</h3>
                            <button class="icon-collapse-left" onclick="toggleSidebar('left')" title="折叠"></button>
                        </div>
                        <div class="tree-search">
                            <input type="text" id="tree-search-input" placeholder="搜索..." oninput="filterTree()">
                        </div>
                        <div id="object-tree" class="tree-view"></div>
                    </div>

                    <div class="main-area">
                        <div class="canvas-container">
                            <canvas id="animation-canvas" width="800" height="600"></canvas>
                            <div class="canvas-overlay" id="canvas-overlay">选择动画开始播放</div>
                        </div>
                        <div class="player-controls">
                            <div class="control-group">
                                <button class="icon-prev" onclick="prevFrame()" title="上一帧"></button>
                                <button id="play-btn" class="icon-play" onclick="togglePlay()" title="播放/暂停"></button>
                                <button class="icon-stop" onclick="stopAnimation()" title="停止"></button>
                                <button class="icon-next" onclick="nextFrame()" title="下一帧"></button>
                                <button class="btn-reset" onclick="resetViewport()" title="重置视图">1:1</button>
                            </div>
                            <div class="control-group">
                                <label>速度:</label>
                                <select id="speed-select" onchange="changeSpeed()">
                                    <option value="0.25">0.25x</option>
                                    <option value="0.5">0.5x</option>
                                    <option value="1" selected>1x</option>
                                    <option value="2">2x</option>
                                    <option value="4">4x</option>
                                </select>
                            </div>
                            <div class="control-group">
                                <label><input type="checkbox" id="loop-checkbox" checked> 循环</label>
                                <label><input type="checkbox" id="anchor-checkbox" onchange="toggleAnchor()"> 锚点</label>
                                <label><input type="checkbox" id="collision-checkbox" onchange="toggleCollision()"> 碰撞</label>
                            </div>
                            <div class="frame-info">
                                <span id="frame-counter">0/0</span>
                                <span id="zoom-display">100%</span>
                                <span id="anim-name"></span>
                                <button onclick="exportCurrentFrames()" id="export-btn" style="display:none;min-width:auto;padding:3px 10px;font-size:11px">导出帧图</button>
                            </div>
                        </div>
                        <div class="timeline-container">
                            <input type="range" id="timeline" min="0" max="100" value="0" oninput="seekToFrame(this.value)">
                        </div>
                    </div>

                    <div class="sidebar right-sidebar">
                        <div class="sidebar-header">
                            <h3>属性</h3>
                            <button class="icon-collapse-right" onclick="toggleSidebar('right')" title="折叠"></button>
                        </div>
                        <div id="properties-panel" class="properties">
                            <div class="prop-group">
                                <h4>精灵</h4>
                                <div id="sprite-info"><p class="placeholder">-</p></div>
                            </div>
                            <div class="prop-group">
                                <h4>锚点</h4>
                                <div id="anchor-info"><p class="placeholder">-</p></div>
                            </div>
                            <div class="prop-group">
                                <h4>碰撞</h4>
                                <div id="collision-info"><p class="placeholder">-</p></div>
                            </div>
                            <div class="prop-group">
                                <h4>图集</h4>
                                <div id="atlas-info"><p class="placeholder">-</p></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="audio-panel">
                    <div class="audio-header" onclick="toggleAudioPanel()">
                        <h3>音频</h3>
                        <span id="audio-toggle-icon">▼</span>
                    </div>
                    <div id="audio-list" class="hidden">
                        <div class="audio-player">
                            <div class="audio-controls">
                                <button class="icon-play" onclick="playCurrentAudio()" id="audio-play-btn"></button>
                                <button class="icon-stop" onclick="stopAudio()"></button>
                                <span id="audio-name">-</span>
                            </div>
                            <div class="audio-progress">
                                <input type="range" id="audio-timeline" min="0" max="100" value="0">
                                <span id="audio-time">00:00 / 00:00</span>
                            </div>
                        </div>
                        <div id="audio-files" class="audio-files-list"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Evk Parser v1.0 · Node.js + Express</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
